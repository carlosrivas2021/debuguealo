name: dp-demo-orders

services:
  api:
    image: debugpilot-demo-orders:local
    build: .
    environment:
      APP_MARKER: ${APP_MARKER:-initial}
      UPSTREAM_URL: http://dp-demo-catalog-api:8000
    networks:
      shared:
        aliases:
          - dp-demo-orders-api
    labels:
      io.debugpilot.demo: multi-project
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 3s

  worker:
    image: debugpilot-demo-orders:local
    build: .
    command: ["python", "app.py", "worker"]
    environment:
      APP_MARKER: ${APP_MARKER:-initial}
      API_URL: http://dp-demo-orders-api:8000/flow
    networks: [shared]
    labels:
      io.debugpilot.demo: multi-project
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 3s

networks:
  shared:
    external: true
    name: debugpilot-demo-shared
