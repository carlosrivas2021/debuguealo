name: dp-demo-fastapi

services:
  api:
    image: debugpilot-demo-fastapi-api:local
    build: .
    ports:
      - "127.0.0.1:${FASTAPI_DEBUG_API_PORT:-8000}:8000"
      - "127.0.0.1:${FASTAPI_DEBUG_DAP_PORT:-5678}:5678"
    labels:
      io.debugpilot.demo: fastapi-debug
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 3s
