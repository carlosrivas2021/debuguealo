[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "debugealo"
version = "1.3.0"
description = "Local-first Docker debugging, with a UI-independent Python engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["docker", "debugger", "tui", "debugpy", "delve", "compose"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "debugpy>=1.8,<2",
  "docker>=7.1,<8",
  "platformdirs>=4.3,<5",
  "pyte>=0.8.2,<0.9",
  "pywinpty>=3.1.2,<4; sys_platform == 'win32'",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "textual>=1,<7",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/carlosrivas2021/debuguealo"
Repository = "https://github.com/carlosrivas2021/debuguealo"
Issues = "https://github.com/carlosrivas2021/debuguealo/issues"
Changelog = "https://github.com/carlosrivas2021/debuguealo/blob/main/CHANGELOG.md"

[project.scripts]
debugealo = "debugpilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/debugealo", "src/debugpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a real local external dependency"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Preserve the user's verbatim specification, including Python code fences.
extend-exclude = ["odd"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
