name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests

  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is informational until its run is green; Linux is the required check.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The debugger tests drive real Delve and Node, as users do.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: uv run pytest -q -n auto -m "not integration" tests/unit

  integration:
    runs-on: ubuntu-latest
    # Real Docker; kept apart so an infrastructure hiccup never blocks a merge.
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q tests/integration
